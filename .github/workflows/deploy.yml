name: Deploy Docker image to macOS runner

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/study-timer
  DEPLOY_NETWORK: study-timer-network
  DATA_VOLUME: study-timer-data
  PROXY_CONTAINER: study-timer-proxy

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: [self-hosted, macOS]
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy blue/green application
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          command -v docker >/dev/null || { echo "Docker is required on the self-hosted runner."; exit 1; }

          monitor_dir="${RUNNER_TEMP}/study-timer-monitor"
          monitor_log="${monitor_dir}/requests.csv"
          monitor_phase="${monitor_dir}/phase"
          monitor_stop="${monitor_dir}/stop"
          mkdir -p "${monitor_dir}"
          printf 'timestamp,phase,endpoint,status,version,response_ms\n' > "${monitor_log}"
          printf 'before\n' > "${monitor_phase}"
          rm -f "${monitor_stop}"
          monitor_loop() {
            while [[ ! -f "${monitor_stop}" ]]; do
              phase="$(cat "${monitor_phase}" 2>/dev/null || echo before)"
              for endpoint in health stats; do
                body="${monitor_dir}/response-${endpoint}.json"
                url="http://127.0.0.1:8000/${endpoint}"
                if [[ "${endpoint}" == stats ]]; then
                  url="${url}?user_name=ci-monitor"
                fi
                result="$(curl --max-time 3 --silent --show-error --output "${body}" --write-out '%{http_code} %{time_total}' "${url}" 2>/dev/null || echo '000 0')"
                status="${result%% *}"
                seconds="${result#* }"
                response_ms="$(python3 -c "print(round(float('${seconds}') * 1000, 1))" 2>/dev/null || echo 0)"
                version=""
                if [[ -s "${body}" ]]; then
                  version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version", ""))' "${body}" 2>/dev/null || true)"
                fi
                printf '%s,%s,%s,%s,%s,%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${phase}" "${endpoint}" "${status}" "${version}" "${response_ms}" >> "${monitor_log}"
              done
              sleep 0.5
            done
          }
          monitor_loop &
          monitor_pid=$!
          before_enabled=false
          sleep 2
          if curl --max-time 3 --silent --fail http://127.0.0.1:8000/health >/dev/null 2>&1; then
            before_enabled=true
          fi
          summary_written=false
          finish_deploy() {
            rc=$?
            printf 'after\n' > "${monitor_phase}"
            sleep 10
            touch "${monitor_stop}"
            wait "${monitor_pid}" 2>/dev/null || true

            {
              echo '## Deployment availability verification'
              echo
              echo '| Phase | Requests | Successes | Failures | Response versions |'
              echo '|---|---:|---:|---:|---|'
              for phase in before during after; do
                if [[ "${phase}" == before && "${before_enabled}" != true ]]; then
                  echo "| ${phase} | skipped (no previous service) | - | - | - |"
                  continue
                fi
                totals="$(awk -F, -v p="${phase}" 'NR>1 && $2==p {total++; if ($4 ~ /^2[0-9][0-9]$/) ok++; else bad++} END {printf "%d %d %d", total+0, ok+0, bad+0}' "${monitor_log}")"
                read -r total ok bad <<<"${totals}"
                versions="$(awk -F, -v p="${phase}" 'NR>1 && $2==p && $5!="" {v[$5]=1} END {first=1; for (x in v) {if (!first) printf ", "; printf "%s", x; first=0}}' "${monitor_log}" | sort -u | paste -sd ', ' -)"
                [[ -n "${versions}" ]] || versions='-'
                echo "| ${phase} | ${total} | ${ok} | ${bad} | ${versions} |"
              done
              echo
              echo "Full request log: workflow artifact \`study-timer-deployment-monitor\`."
            } >> "${GITHUB_STEP_SUMMARY}"
            summary_written=true

            relevant_failures="$(awk -F, -v skip_before="${before_enabled}" 'NR>1 && ($2!="before" || skip_before=="true") && $4 !~ /^2[0-9][0-9]$/ {n++} END {print n+0}' "${monitor_log}")"
            last_version="$(awk -F, 'NR>1 && $5!="" {v=$5} END {print v}' "${monitor_log}")"
            if [[ "${rc}" -eq 0 && "${relevant_failures}" -gt 0 ]]; then
              echo "Deployment monitor detected ${relevant_failures} failed request(s)." >&2
              rc=1
            fi
            if [[ "${rc}" -eq 0 && "${last_version}" != "${IMAGE_TAG}" ]]; then
              echo "Deployment monitor ended on version '${last_version}', expected '${IMAGE_TAG}'." >&2
              rc=1
            fi
            docker logout >/dev/null 2>&1 || true
            exit "${rc}"
          }
          trap finish_deploy EXIT

          echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
          docker network inspect "${DEPLOY_NETWORK}" >/dev/null 2>&1 || docker network create "${DEPLOY_NETWORK}"
          docker volume inspect "${DATA_VOLUME}" >/dev/null 2>&1 || docker volume create "${DATA_VOLUME}"

          active=""
          if docker ps --format '{{.Names}}' | grep -qx "${PROXY_CONTAINER}"; then
            proxy_config="$(docker exec "${PROXY_CONTAINER}" cat /etc/nginx/nginx.conf)"
            blue_in_proxy=false
            green_in_proxy=false
            grep -Eq "server[[:space:]]+study-timer-blue:8000" <<<"${proxy_config}" && blue_in_proxy=true
            grep -Eq "server[[:space:]]+study-timer-green:8000" <<<"${proxy_config}" && green_in_proxy=true
            if [[ "${blue_in_proxy}" == true && "${green_in_proxy}" == true ]] || \
               [[ "${blue_in_proxy}" == false && "${green_in_proxy}" == false ]]; then
              echo "Could not determine exactly one active backend from ${PROXY_CONTAINER}."
              exit 1
            fi
            if [[ "${blue_in_proxy}" == true ]]; then
              active=blue
            else
              active=green
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx "study-timer-${active}"; then
              echo "Proxy points to ${active}, but that container is not running; refusing deployment."
              exit 1
            fi
          else
            blue_running=false
            green_running=false
            docker ps --format '{{.Names}}' | grep -qx study-timer-blue && blue_running=true
            docker ps --format '{{.Names}}' | grep -qx study-timer-green && green_running=true
            if [[ "${blue_running}" == true && "${green_running}" == true ]]; then
              echo "Both blue and green are running but the proxy is unavailable; refusing deployment."
              exit 1
            elif [[ "${blue_running}" == true ]]; then
              active=blue
            elif [[ "${green_running}" == true ]]; then
              active=green
            fi
          fi
          if [[ "${active}" == "blue" ]]; then next=green; else next=blue; fi
          next_container="study-timer-${next}"
          old_container=""
          if [[ -n "${active}" ]]; then
            old_container="study-timer-${active}"
          fi

          printf 'during\n' > "${monitor_phase}"
          docker rm -f "${next_container}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${next_container}" \
            --network "${DEPLOY_NETWORK}" \
            --restart unless-stopped \
            --env "APP_VERSION=${IMAGE_TAG}" \
            --env STUDY_TIMER_DB_PATH=/data/study_timer.sqlite3 \
            --volume "${DATA_VOLUME}:/data" \
            "${IMAGE_NAME}:${IMAGE_TAG}"

          echo "Waiting for ${next_container} health check..."
          healthy=false
          for attempt in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "${next_container}" 2>/dev/null || true)"
            if [[ "${status}" == "healthy" ]]; then
              healthy=true
              break
            fi
            if [[ "${status}" == "unhealthy" || "${status}" == "" ]]; then
              docker logs "${next_container}" || true
            fi
            sleep 2
          done
          if [[ "${healthy}" != true ]]; then
            echo "Health check failed for ${next_container}; keeping ${old_container:-no previous container} running."
            docker inspect "${next_container}" || true
            docker logs "${next_container}" || true
            docker rm -f "${next_container}" >/dev/null 2>&1 || true
            exit 1
          fi

          cat > "${RUNNER_TEMP}/study-timer-nginx.conf" <<EOF
          events {}
          http {
            upstream study_timer_backend { server ${next_container}:8000; }
            server {
              listen 8000;
              location / { proxy_pass http://study_timer_backend; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }
            }
          }
          EOF

          if ! docker ps --format '{{.Names}}' | grep -qx "${PROXY_CONTAINER}"; then
            docker rm -f "${PROXY_CONTAINER}" >/dev/null 2>&1 || true
            docker run -d \
              --name "${PROXY_CONTAINER}" \
              --network "${DEPLOY_NETWORK}" \
              --restart unless-stopped \
              --publish 127.0.0.1:8000:8000 \
              nginx:1.27-alpine
          fi

          # Keep the proxy configuration inside the container. RUNNER_TEMP is only
          # used as a transient docker cp source and is never bind-mounted.
          docker cp "${RUNNER_TEMP}/study-timer-nginx.conf" "${PROXY_CONTAINER}:/tmp/nginx.conf.next"
          docker exec "${PROXY_CONTAINER}" nginx -t -c /tmp/nginx.conf.next
          if [[ -n "${old_container}" ]]; then
            docker cp "${PROXY_CONTAINER}:/etc/nginx/nginx.conf" "${RUNNER_TEMP}/nginx.conf.previous"
          fi
          docker cp "${RUNNER_TEMP}/study-timer-nginx.conf" "${PROXY_CONTAINER}:/etc/nginx/nginx.conf"
          if ! docker exec "${PROXY_CONTAINER}" nginx -t; then
            if [[ -n "${old_container}" ]]; then
              docker cp "${RUNNER_TEMP}/nginx.conf.previous" "${PROXY_CONTAINER}:/etc/nginx/nginx.conf"
              docker exec "${PROXY_CONTAINER}" nginx -s reload || true
            fi
            docker rm -f "${next_container}" >/dev/null 2>&1 || true
            exit 1
          fi
          if ! docker exec "${PROXY_CONTAINER}" nginx -s reload; then
            if [[ -n "${old_container}" ]]; then
              docker cp "${RUNNER_TEMP}/nginx.conf.previous" "${PROXY_CONTAINER}:/etc/nginx/nginx.conf"
              docker exec "${PROXY_CONTAINER}" nginx -s reload || true
            fi
            docker rm -f "${next_container}" >/dev/null 2>&1 || true
            exit 1
          fi

          printf 'after\n' > "${monitor_phase}"
          sleep 5
          if [[ -n "${old_container}" ]]; then
            docker rm -f "${old_container}" >/dev/null 2>&1 || true
          fi
          echo "Deployment complete: ${IMAGE_NAME}:${IMAGE_TAG} (${next})."

      - name: Upload deployment request log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-timer-deployment-monitor
          path: ${{ runner.temp }}/study-timer-monitor/requests.csv
          if-no-files-found: warn
