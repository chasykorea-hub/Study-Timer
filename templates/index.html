<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Timer</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="shell"><header><p class="eyebrow">FOCUS LAB</p><h1>스터디 타이머</h1><p class="subtitle">집중하고, 기록하고, 꾸준함을 확인하세요.</p></header>
<section class="card setup"><div class="fields"><label>사용자 이름<input id="user" maxlength="60" placeholder="예: 민수"></label><label>공부할 과목<input id="subject" maxlength="100" placeholder="예: 운영체제"></label></div><div class="options"><label>집중(분)<input id="focusMinutes" type="number" min="1" max="120" value="25"></label><label>휴식(분)<input id="breakMinutes" type="number" min="1" max="60" value="5"></label></div><p class="hint">테스트할 때 집중·휴식 시간을 1분처럼 짧게 설정할 수 있습니다.</p></section>
<section class="card timer"><div class="timer-top"><span id="phase" class="badge">집중</span><span id="cycle">1회차</span></div><div id="time">25:00</div><div class="progress"><div id="progressBar"></div></div><p id="status">이름과 과목을 입력하고 시작하세요.</p><div class="actions"><button id="start">시작</button><button id="pause" class="secondary" disabled>일시정지</button><button id="reset" class="ghost">초기화</button></div></section>
<section class="stats-grid"><div class="card"><h2>오늘 과목별 공부 시간</h2><div id="todayStats" class="empty">아직 기록이 없습니다.</div></div><div class="card"><h2>최근 7일</h2><div class="week-summary"><span>7일 합계<strong id="weekTotal">0분</strong></span><span>하루 평균<strong id="weekAverage">0분</strong></span><span>연속 공부<strong id="streak">0일</strong></span></div><div id="weekStats" class="week"></div></div></section><p id="appVersion" class="app-version"></p><div id="toast" role="status"></div></main><script src="/static/app.js"></script></body></html>
